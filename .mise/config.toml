[settings]
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
1password-cli = "2.41.0"
actionlint = "1.7.12"
"github:mitsuhiko/minijinja" = "3.0.1"
"github:home-operations/flate" = "v0.6.5"
flux2 = "2.9.6"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
"github:home-operations/kopiur" = "0.10.16"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "26.12.1"
opentofu = "1.13.2"
oxfmt = "0.74.0"
shellcheck = "0.11.0"
talos = "1.14.4"
yq = "4.54.1"
zizmor = "1.31.1"
cosign = "3.1.4"
