[settings]
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
1password-cli = "2.40.0"
actionlint = "1.7.12"
"github:mitsuhiko/minijinja" = "3.0.0"
"github:home-operations/flate" = "v0.6.5"
flux2 = "2.9.6"
gum = "2.0.2"
helm = "4.3.0"
helmfile = "1.8.1"
jq = "1.8.2"
just = "1.58.0"
"github:home-operations/kopiur" = "0.10.12"
kubectl = "1.37.1"
kustomize = "5.8.2"
lefthook = "2.2.0"
node = "26.11.1"
opentofu = "1.13.1"
oxfmt = "0.72.0"
shellcheck = "0.11.0"
talos = "1.14.2"
yq = "4.54.1"
zizmor = "1.30.1"
cosign = "3.1.3"
