---
# This is the bootstrap Doco-CD instance deployed through the TrueNAS SCALE UI.
# It polls the repository and deploys the main Doco-CD instance through the
# `updater` deployment target in .doco-cd.updater.yaml.
configs:
  poll-config.yml:
    content: |
      - url: https://github.com/ishioni/homelab-ops.git
        reference: master
        interval: 3600
        target: updater

secrets:
  1pw_token:
    file: /mnt/SSD/Userhomes/movi/.config/doco-cd/1pw_token

services:
  app:
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    container_name: doco-cd-updater
    environment:
      DEPLOY_CONFIG_BASE_DIR: ./docker/.doco-cd/
      HTTP_PORT: 8080
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      SCHEDULER_ENABLED: "false"
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
      SECRET_PROVIDER_CACHE_ENABLED: "true"
      SECRET_PROVIDER_CACHE_TTL: "6h"
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.110.0@sha256:69dd02c0ff847870d29d4fc769d309913826f73a2fbd18254f4ccb4d04e216e1
    restart: unless-stopped
    secrets:
      - 1pw_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-data:/data

volumes:
  updater-data: {}
