---
services:
  dexd:
    image: ghcr.io/ishioni/dexd:0.4.3@sha256:6a45117b0f96babadc79a510d712f7ddfcc7c908c1e9e0c8e9714459a0af1b20
    container_name: dexd
    restart: unless-stopped
    environment:
      # Required
      UNIFI_HOST: ${UNIFI_HOST}
      UNIFI_API_KEY: ${UNIFI_TOKEN}
      DEFAULT_TARGET: ${DEFAULT_TARGET}
      UNIFI_INSECURE_SKIP_VERIFY: false
      TXT_PREFIX: leo.
      METRICS_ADDR: :4320
    ports:
      - "4320:4320"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
