---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server-b9570@sha256:4c52f549b6612fc1b4aee696c4cfb4a9dceecb10216bb7e677cf97db909e1b4a
    container_name: qwen
    restart: unless-stopped
    mem_limit: 24g
    cpus: 4
    security_opt:
      - no-new-privileges:true

    networks:
      apps:
    environment:
      TZ: Europe/Warsaw
      HF_HOME: /root/.cache/huggingface
      LLAMA_CACHE: /root/.cache/llama.cpp
      LLAMA_ARG_HF_REPO: unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M
      LLAMA_ARG_ALIAS: qwen3-coder-30b-a3b-q4-k-m
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: ${APP_PORT}
      LLAMA_ARG_CTX_SIZE: 16384
      LLAMA_ARG_THREADS: 4
      LLAMA_ARG_THREADS_BATCH: 4
      LLAMA_ARG_N_PARALLEL: 1

      LLAMA_ARG_CACHE_RAM: 512
    command:
      - --jinja
      - --no-ui
      - --poll
      - "0"
      - --sleep-idle-seconds
      - "300"
    expose:
      - ${APP_PORT}
    volumes:
      - ${DATA_PATH}/cache:/root/.cache
    labels:
      traefik.enable: "true"
      traefik.http.services.qwen.loadbalancer.server.port: ${APP_PORT}
      traefik.http.routers.qwen.entrypoints: https
      traefik.http.routers.qwen.rule: Host(`${HOST}`)
      traefik.http.routers.qwen.tls: "true"
      traefik.http.routers.qwen.service: qwen
      traefik.http.routers.qwen.middlewares: qwen-lan
      traefik.http.middlewares.qwen-lan.ipallowlist.sourcerange: 10.1.0.0/16
      dexd.enabled: "true"

networks:
  apps:
    external: true
