---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9570@sha256:5e6de18a610baece861f7566a8c51c11e548b8afc163d85378eea8a2ac694893
    container_name: qwen
    restart: unless-stopped
    mem_limit: 16g
    cpus: 4
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      apps:
    environment:
      TZ: Europe/Warsaw
      HF_HOME: /root/.cache/huggingface
      LLAMA_CACHE: /root/.cache/llama.cpp
      LLAMA_ARG_HF_REPO: Qwen/Qwen3-8B-GGUF:Q5_K_M
      LLAMA_ARG_ALIAS: qwen3-8b-q5-k-m
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: ${APP_PORT}
      LLAMA_ARG_CTX_SIZE: 8192
      LLAMA_ARG_THREADS: 4
      LLAMA_ARG_THREADS_BATCH: 4
      LLAMA_ARG_N_PARALLEL: 1
      LLAMA_ARG_N_GPU_LAYERS: auto
      LLAMA_ARG_FLASH_ATTN: auto
      LLAMA_ARG_CACHE_RAM: 512
    command:
      - --jinja
      - --no-ui
      - --poll
      - "0"
      - --sleep-idle-seconds
      - "300"
    expose:
      - ${APP_PORT}
    volumes:
      - ${DATA_PATH}/cache:/root/.cache
    labels:
      traefik.enable: "true"
      traefik.http.services.qwen.loadbalancer.server.port: ${APP_PORT}
      traefik.http.routers.qwen.entrypoints: https
      traefik.http.routers.qwen.rule: Host(`${HOST}`)
      traefik.http.routers.qwen.tls: "true"
      traefik.http.routers.qwen.service: qwen
      traefik.http.routers.qwen.middlewares: qwen-lan
      traefik.http.middlewares.qwen-lan.ipallowlist.sourcerange: 10.1.0.0/16
      dexd.enabled: "true"

networks:
  apps:
    external: true
