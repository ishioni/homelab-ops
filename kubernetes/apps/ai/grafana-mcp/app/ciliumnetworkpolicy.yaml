---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: grafana-mcp-proxy
spec:
  # Apply only the targeted deny rule without isolating unrelated pod egress.
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchExpressions:
      - key: io.cilium.k8s.policy.serviceaccount
        operator: NotIn
        values: [mcp-gateway-vmcp]
  egressDeny:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: grafana-mcp
            app.kubernetes.io/name: mcpserver
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-mcp-backend
spec:
  endpointSelector:
    matchLabels:
      toolhive-basename: grafana-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: grafana-mcp
            app.kubernetes.io/name: mcpserver
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
