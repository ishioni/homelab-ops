---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
spec:
  secretStoreRef:
    kind: SecretStore
    name: grafana-mcp
  target:
    name: grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: grafana-mcp-token
        property: token
