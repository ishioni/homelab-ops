---
# yaml-language-server: $schema=https://crd.movishell.pl/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubectl-mcp
spec:
  podSelector:
    matchLabels:
      toolhive-basename: kubectl
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: kubectl
              app.kubernetes.io/name: mcpserver
      ports:
        - protocol: TCP
          port: 8080
