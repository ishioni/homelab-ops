---
# yaml-language-server: $schema=https://crd.movishell.pl/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-mcp-proxy
spec:
  # Apply only the targeted deny rule without isolating unrelated pod egress.
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchExpressions:
      - key: io.cilium.k8s.policy.serviceaccount
        operator: NotIn
        values: [mcp-gateway-vmcp]
  egressDeny:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: prometheus
            app.kubernetes.io/name: mcpserver
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
