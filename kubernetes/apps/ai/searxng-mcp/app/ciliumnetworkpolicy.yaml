---
# yaml-language-server: $schema=https://crd.movishell.pl/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: searxng
      app.kubernetes.io/name: mcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: mcp-gateway
            app.kubernetes.io/name: virtualmcpserver
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-backend
spec:
  endpointSelector:
    matchLabels:
      toolhive-basename: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: searxng
            app.kubernetes.io/name: mcpserver
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
