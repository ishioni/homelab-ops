---
# yaml-language-server: $schema=https://crd.movishell.pl/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-proxy
spec:
  # Deny direct proxy access without blocking replies to ephemeral client ports.
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: searxng
      app.kubernetes.io/name: mcpserver
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: NotIn
              values: [ai]
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
          matchExpressions:
            - key: k8s:io.cilium.k8s.policy.serviceaccount
              operator: NotIn
              values: [mcp-gateway-vmcp]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities: [remote-node, world]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-backend
spec:
  endpointSelector:
    matchLabels:
      toolhive-basename: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: searxng
            app.kubernetes.io/name: mcpserver
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
