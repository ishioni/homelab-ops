---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-mcp-credentials
    creationPolicy: Owner
  data:
    - secretKey: UNIFI_USERNAME
      remoteRef:
        key: unifi
        property: MCP_USERNAME
    - secretKey: UNIFI_PASSWORD
      remoteRef:
        key: unifi
        property: MCP_PASSWORD
