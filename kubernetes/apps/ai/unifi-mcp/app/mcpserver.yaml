---
# yaml-language-server: $schema=https://crd.movishell.pl/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-network
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.36.5
  transport: streamable-http
  mcpPort: 3000
  proxyPort: 8080
  groupRef:
    name: mcp-tools
  podTemplateSpec:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: unifi-mcp-credentials
    spec:
      containers:
        - name: mcp
          envFrom:
            - secretRef:
                name: unifi-mcp-credentials
  env:
    - name: UNIFI_HOST
      value: unifi.${PRIVATE_DOMAIN}
    - name: UNIFI_VERIFY_SSL
      value: "true"
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    # The ToolHive proxy is the only permitted caller (see networkpolicy.yaml).
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
    - name: UNIFI_POLICY_NETWORK_CREATE
      value: "false"
    - name: UNIFI_POLICY_NETWORK_UPDATE
      value: "false"
    - name: UNIFI_POLICY_NETWORK_DELETE
      value: "false"
