---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-cosign-key-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - cosign-public-key
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: &name kyverno-cosign-key-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: *name
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
