---
# yaml-language-server: $schema=https://crd.movishell.pl/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app http-debug
  namespace: &namespace cosign-b
spec:
  dependsOn:
    - name: kyverno
      namespace: kyverno
    - name: external-secrets
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/cosign-b/http-debug/app
  postBuild:
    substitute:
      HOSTNAME: cosign-b.${PUBLIC_DOMAIN}
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-ops
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
