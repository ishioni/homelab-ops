---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
      ref:
        tag: 0.29.2
      interval: 1h
  interval: 30m
  values:
    crds:
      create: true
    replicaCount: 2
    resources:
      requests:
        cpu: 15m
        memory: 250Mi
      limits:
        memory: 500Mi
    monitoring:
      podMonitorEnabled: true
---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
      ref:
        tag: 0.9.0
      interval: 1h
  interval: 30m
