---
# yaml-language-server: $schema=https://crd.movishell.pl/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-apps
spec:
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  enableSuperuserAccess: true
  certificates:
    serverCASecret: postgres-apps-server-tls
    serverTLSSecret: postgres-apps-server-tls
  instances: 3
  smartShutdownTimeout: 30
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f0b080688ea0435ea81f9e8b547cfffe4b177865c4e4f4501cef7ba3780ced0b
  # For a future recovery, archive to a new serverName instead of writing to the source archive.
  # bootstrap:
  #   recovery:
  #     source: postgres-apps
  # externalClusters:
  #   - name: postgres-apps
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: rustfs
  #         serverName: postgres-apps-v1
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: rustfs
        serverName: postgres-apps-v1
  postgresql:
    pg_hba:
      - hostnossl all all all reject
    parameters:
      archive_timeout: "1min"
      max_connections: "300"
      work_mem: 64MB
      shared_buffers: 512MB
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  managed:
    services:
      disabledDefaultServices: ["r", "ro"]
