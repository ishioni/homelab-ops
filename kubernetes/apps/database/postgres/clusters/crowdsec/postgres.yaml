---
# yaml-language-server: $schema=https://crd.movishell.pl/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-crowdsec
spec:
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  instances: 3
  certificates:
    serverCASecret: postgres-crowdsec-server-tls
    serverTLSSecret: postgres-crowdsec-server-tls
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
      secret:
        name: postgres-crowdsec-credentials
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f0b080688ea0435ea81f9e8b547cfffe4b177865c4e4f4501cef7ba3780ced0b
  # For a future recovery, archive to a new serverName instead of writing to the source archive.
  # bootstrap:
  #   recovery:
  #     source: postgres-crowdsec
  #     database: crowdsec
  #     owner: crowdsec
  #     secret:
  #       name: postgres-crowdsec-credentials
  # externalClusters:
  #   - name: postgres-crowdsec
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: rustfs
  #         serverName: postgres-crowdsec-v1
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: rustfs
        serverName: postgres-crowdsec-v1
  postgresql:
    pg_hba:
      - hostnossl all all all reject
    parameters:
      archive_timeout: "1min"
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: openebs-hostpath
