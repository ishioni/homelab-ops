---
# yaml-language-server: $schema=https://crd.movishell.pl/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kopiur-ui-browse
  namespace: downloads
# The browse ClusterRole includes pods/exec; do not bind it cluster-wide.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kopiur-ui-browse
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: infrastructure
