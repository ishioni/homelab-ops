---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name radarr-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # App
        RADARR__AUTH__APIKEY: "{{ .RADARR__API_KEY }}"
        RADARR__POSTGRES__MAINDBCONNECTIONSTRING: 'Host=postgres-apps-rw.database.svc.cluster.local;Port=5432;Database=radarr;Username="{{ .POSTGRES_USER | replace "\"" "\"\"" }}";Password="{{ .POSTGRES_PASS | replace "\"" "\"\"" }}";SSL Mode=VerifyFull;Root Certificate=/etc/internal-ca/ca.crt'
        # Postgres Init
        INIT_POSTGRES_DBNAME: radarr
        INIT_POSTGRES_HOST: postgres-apps-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /etc/internal-ca/ca.crt
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name radarr-internal-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: internal-ca
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: internal-ca-key-pair
        property: tls.crt
