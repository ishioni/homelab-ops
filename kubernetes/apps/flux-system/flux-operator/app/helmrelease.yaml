---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      ref:
        tag: 0.64.0
      interval: 1h
  interval: 30m
  values:
    serviceMonitor:
      create: true
    web:
      httpRoute:
        enabled: true
        annotations:
        gatus.home-operations.com/endpoint: |-
          name: flux-operator
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames: ["${HOSTNAME}"]
      configSecretName: flux-web-secret
      networkPolicy:
        create: false
