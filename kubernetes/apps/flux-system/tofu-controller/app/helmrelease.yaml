---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/ishioni/charts/tofu-controller
      ref:
        tag: 0.16.5-ishioni.2
      interval: 1h
  interval: 30m
  values:
    awsPackage:
      install: false
    branchPlanner:
      enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
