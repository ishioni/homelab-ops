---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/home-operations/charts/konflate
      ref:
        tag: 0.6.6
      interval: 1h
  interval: 30m
  values:
    image:
      tag: "main"
      digest: ""
      pullPolicy: Always
    config:
      repo: github://ishioni/homelab-ops
      clusterPath: ./kubernetes/flux/cluster
      statusChecks: true
      prComments: true
      publicUrl: https://${HOSTNAME}
      verifyImages: true
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 2Gi
    secret:
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames: ["${HOSTNAME}"]
