---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-schemas
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/sholdee/charts/crd-schema-publisher
      ref:
        tag: 2026.1121.63640
      interval: 1h
  interval: 30m
  values:
    config:
      cfPagesProject: homelab-schema
      includeBuiltins: true
      includeKustomize: true
    existingSecret:
      name: kubernetes-schemas
    fullnameOverride: "kubernetes-schemas"
    metrics:
      podMonitor:
        enabled: true
        interval: 1m
    grafana:
      dashboard:
        operator:
          enabled: true
          defaultInstanceSelector:
            enabled: false
          folder: Operators
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          datasources:
            - datasourceName: prometheus
              inputName: DS_PROMETHEUS
