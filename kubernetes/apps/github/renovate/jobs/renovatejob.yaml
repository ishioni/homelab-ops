---
# yaml-language-server: $schema=https://crd.movishell.pl/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: ishioni
spec:
  discoverTopics: [renovate]
  provider:
    name: github
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
      value: '["goGenerate", "mise"]'
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^helm-docs ", "^helm-schema "]'
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/internal-ca/ca.crt
    - name: RENOVATE_REDIS_URL
      valueFrom:
        secretKeyRef:
          name: ishioni-bot-token
          key: RENOVATE_REDIS_URL
  extraVolumes:
    - name: internal-ca
      secret:
        secretName: renovate-internal-ca
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: internal-ca
      mountPath: /etc/internal-ca
      readOnly: true
  image: ghcr.io/renovatebot/renovate:44.199.2
  parallelism: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 0 * * * *
  secretRef: ishioni-bot-token
  webhook:
    enabled: true
