---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/stakater/charts/reloader
      ref:
        tag: 2.2.21
      interval: 1h
  interval: 30m
  values:
    fullnameOverride: reloader
    resources:
      limits:
        cpu: 50m
        memory: 50Mi
