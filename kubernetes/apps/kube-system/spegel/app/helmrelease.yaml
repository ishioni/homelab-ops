---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/spegel-org/helm-charts/spegel
      ref:
        tag: 0.8.2
      interval: 1h
  interval: 30m
  values:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      mirrorResolveTimeout: 40ms
    service:
      registry:
        hostPort: 29999
    serviceMonitor:
      enabled: true
