---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/home-operations/charts/tuppr
      ref:
        tag: 0.5.14
      interval: 1h
  interval: 30m
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
        interval: 1m
      promethetusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: Operators
          matchLabels:
            grafana.internal/instance: grafana
