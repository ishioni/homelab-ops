---
alerting:
  pushover:
    title: Gatus
    application-token: ${PUSHOVER_GATUS_KEY}
    user-key: ${PUSHOVER_USER_KEY}
    priority: 1
    resolved-priority: 0
    default-alert:
      description: health-check failed
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 3
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m
endpoints:
  - name: postgres-apps
    group: Services
    url: tcp://postgres-apps-rw.database.svc.cluster.local:5432
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-hostname: true
      hide-url: true
    alerts:
      - type: pushover
        send-on-resolved: true
  - name: postgres-immich
    group: Services
    url: tcp://postgres-immich-rw.database.svc.cluster.local:5432
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-hostname: true
      hide-url: true
    alerts:
      - type: pushover
        send-on-resolved: true
  - name: postgres-crowdsec
    group: Services
    url: tcp://postgres-crowdsec-rw.database.svc.cluster.local:5432
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-hostname: true
      hide-url: true
    alerts:
      - type: pushover
        send-on-resolved: true
  - name: rustfs
    group: Services
    url: https://rustfs.${PRIVATE_DOMAIN}/health
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    client:
      dns-resolver: tcp://10.1.2.1:53
    conditions:
      - "[STATUS] == 200"
  - name: rustcdn
    group: Services
    url: https://rcdnconsole.${PRIVATE_DOMAIN}/health
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    client:
      dns-resolver: tcp://10.1.2.1:53
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover
        send-on-resolved: true

metrics: true
storage:
  type: postgres
  path: postgres://${INIT_POSTGRES_USER}:${INIT_POSTGRES_PASS}@${INIT_POSTGRES_HOST}:5432/${INIT_POSTGRES_DBNAME}?sslmode=verify-full&sslrootcert=/etc/internal-ca/ca.crt
  caching: true
ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/50323052
  link: https://github.com/ishioni
  buttons:
    - name: Github
      link: https://github.com/ishioni
    - name: Homelab
      link: https://github.com/ishioni/homelab-ops
web:
  port: ${GATUS_WEB_PORT}
