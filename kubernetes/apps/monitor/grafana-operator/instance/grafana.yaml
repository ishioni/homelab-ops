---
# yaml-language-server: $schema=https://crd.movishell.pl/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      oauth_auto_login: "true"
      disable_login_form: "false"
      oauth_allow_insecure_email_lookup: "true"
    auth.anonymous:
      enabled: "false"
    auth.generic_oauth:
      allow_assign_grafana_admin: "true"
      api_url: https://${AUTH_HOSTNAME}/application/o/userinfo/
      auth_url: https://${AUTH_HOSTNAME}/application/o/authorize/
      enabled: "true"
      icon: signin
      name: ${PUBLIC_DOMAIN}
      role_attribute_path: contains(groups[*], 'infrastructure') && 'Admin' || 'Viewer'
      scopes: openid email profile offline_access
      signout_redirect_url: https://${AUTH_HOSTNAME}/application/o/grafana/end-session/
      token_url: https://${AUTH_HOSTNAME}/application/o/token/
      use_pkce: "true"
      use_refresh_token: "true"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://${HOSTNAME}
  disableDefaultAdminSecret: false
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-secret
              env:
                - name: GF_RENDERING_CALLBACK_URL
                  valueFrom:
                    secretKeyRef:
                      name: grafana-image-renderer
                      key: GF_RENDERING_CALLBACK_URL
                - name: GF_RENDERING_RENDERER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grafana-image-renderer
                      key: GF_RENDERING_RENDERER_TOKEN
                - name: GF_RENDERING_SERVER_URL
                  valueFrom:
                    secretKeyRef:
                      name: grafana-image-renderer
                      key: GF_RENDERING_SERVER_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
            - name: image-renderer
              image: docker.io/grafana/grafana-image-renderer:v5.12.0
              env:
                - name: AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grafana-image-renderer
                      key: AUTH_TOKEN
              ports:
                - name: renderer
                  containerPort: 8081
              startupProbe:
                httpGet:
                  path: /healthz
                  port: renderer
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: renderer
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: renderer
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: image-renderer-home
                  mountPath: /home/nonroot
                - name: image-renderer-tmp
                  mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
          volumes:
            - name: image-renderer-home
              emptyDir: {}
            - name: image-renderer-tmp
              emptyDir: {}
  httpRoute:
    metadata:
      annotations:
        gatus.home-operations.com/endpoint: |-
          name: grafana
          url: https://grafana.${PRIVATE_DOMAIN}/api/health
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/name: Grafana
        gethomepage.dev/icon: grafana.svg
    spec:
      hostnames: ["${HOSTNAME}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
  disableDefaultSecurityContext: All
