---
# yaml-language-server: $schema=https://crd.movishell.pl/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-mcp-secret-reader
  namespace: monitor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-mcp-token"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
