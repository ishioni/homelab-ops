---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: crowdsec-secret
    creationPolicy: Owner
    template:
      data:
        BOUNCER_KEY_ENVOY: "{{ .BOUNCER_KEY }}"
        DB_PASSWORD: "{{ .POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: crowdsec
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi-cscli-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: crowdsec-lapi-cscli-credentials
    creationPolicy: Owner
    template:
      data:
        local_api_credentials.yaml: |
          url: http://127.0.0.1:8080
          login: lapi-cscli
          password: {{ .LAPI_PASSWORD | toJson }}
  dataFrom:
    - extract:
        key: crowdsec
