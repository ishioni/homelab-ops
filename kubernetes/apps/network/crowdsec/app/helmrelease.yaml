---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  install:
    disableSchemaValidation: true
  interval: 30m
  upgrade:
    disableSchemaValidation: true
  values:
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    lapi:
      env:
        - name: USE_WAL
          value: "true"
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      persistentVolume:
        data:
          storageClassName: openebs-hostpath
        config:
          storageClassName: openebs-hostpath
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 500Mi
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 250Mi
      metrics:
        serviceMonitor:
          enabled: true
