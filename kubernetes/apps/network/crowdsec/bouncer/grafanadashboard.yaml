---
# yaml-language-server: $schema=https://crd.movishell.pl/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: crowdsec-bouncer
spec:
  allowCrossNamespaceImport: true
  configMapRef:
    name: crowdsec-bouncer-dashboard
    key: bouncer.json
  folder: Networking
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
