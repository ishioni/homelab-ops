---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-bouncer
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  interval: 30m
  values:
    fullnameOverride: *app
    podAnnotations:
      secret.reloader.stakater.com/reload: crowdsec-secret
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    config:
      trustedIPHeader: X-Envoy-External-Address
      exemptIPs:
        - 10.1.0.0/16
        - 172.16.0.0/16
      bouncer:
        lapiURL: http://crowdsec-service:8080
        metrics: true
        apiKeySecretRef:
          name: crowdsec-secret
          key: BOUNCER_KEY_ENVOY
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
