---
# yaml-language-server: $schema=https://crd.movishell.pl/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: crowdsec-bouncer
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  extAuth:
    failOpen: true
    timeout: 1s
    headersToExtAuth:
      - X-Envoy-External-Address
      - X-Forwarded-For
    grpc:
      backendRefs:
        - name: crowdsec-bouncer
          port: 8080
