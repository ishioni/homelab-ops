---
# yaml-language-server: $schema=https://crd.movishell.pl/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-postgres
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f0b080688ea0435ea81f9e8b547cfffe4b177865c4e4f4501cef7ba3780ced0b
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
      secret:
        name: crowdsec-postgres-credentials
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: rustfs
        serverName: crowdsec-postgres-v1
  postgresql:
    parameters:
      archive_timeout: "1min"
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: openebs-hostpath
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: crowdsec-postgres
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: crowdsec-postgres
      cnpg.io/podRole: instance
---
# yaml-language-server: $schema=https://crd.movishell.pl/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: crowdsec-postgres
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  backupOwnerReference: self
  cluster:
    name: crowdsec-postgres
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 0 0 * * *"
