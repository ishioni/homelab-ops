---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: internal-ca
spec:
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: [ai, github, selfhosted]
  provider:
    kubernetes:
      remoteNamespace: security
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: security
      auth:
        serviceAccount:
          name: internal-ca-reader
          namespace: security
