---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name atuin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        ATUIN_DB_URI: |-
          postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-apps-rw.database.svc.cluster.local/atuin?sslmode=verify-full&sslrootcert=/etc/internal-ca/ca.crt
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /etc/internal-ca/ca.crt
        INIT_POSTGRES_DBNAME: atuin
        INIT_POSTGRES_HOST: postgres-apps-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: atuin
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name atuin-internal-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: internal-ca
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: internal-ca-key-pair
        property: tls.crt
