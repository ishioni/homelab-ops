---
mqtt:
  enabled: false

auth:
  enabled: false
  trusted_proxies:
    - 172.16.0.0/16

proxy:
  header_map:
    user: X-authentik-username
    role: X-authentik-groups
    role_map:
      admin:
        - infrastructure
  separator: "|"
  default_role: viewer

tls:
  enabled: false

database:
  path: /config/frigate.db

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi
  output_args:
    record: preset-record-generic-audio-copy

detect:
  enabled: true
  fps: 5

record:
  enabled: true
  continuous:
    days: 1
  motion:
    days: 10
  alerts:
    pre_capture: 30
    post_capture: 30
  detections:
    pre_capture: 30
    post_capture: 30

audio:
  enabled: true
  min_volume: 500
  max_not_heard: 30
  listen:
    # Sleep and respiratory sounds
    - snoring
    - breathing
    - wheeze
    - gasp
    - cough
    - sneeze
    # Voices and nearby activity
    - speech
    - whispering
    - yell
    - crying
    - laughter
    - footsteps
  filters:
    snoring:
      threshold: 0.7

snapshots:
  enabled: true

cameras:
  kids:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_KIDS_RTSP_USER}:{FRIGATE_KIDS_RTSP_PASSWORD}@camera-kids.ishioni.casa/live0
          roles:
            - detect
            - record
            - audio
  bedroom:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_BEDROOM_RTSP_USER}:{FRIGATE_BEDROOM_RTSP_PASSWORD}@camera-bedroom.ishioni.casa/live0
          roles:
            - detect
            - record
            - audio
