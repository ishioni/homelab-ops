---
# yaml-language-server: $schema=https://crd.movishell.pl/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app frigate
  namespace: &namespace selfhosted
spec:
  components:
    - ../../../../components/gpu
    - ../../../../components/kopiur
    - ../../../../components/authentik-proxy
  dependsOn:
    - name: dcsi-iscsi
      namespace: storage
    - name: external-secrets
      namespace: security
    - name: intel-gpu-resource-driver
      namespace: kube-system
    - name: kopiur
      namespace: storage
  interval: 30m
  path: ./kubernetes/apps/selfhosted/frigate/app
  postBuild:
    substitute:
      APP: *app
      HOSTNAME: frigate.${PRIVATE_DOMAIN}
      PVC_CLAIM: frigate-config
      PVC_CAPACITY: 5Gi
      PVC_STORAGECLASS: &sc dcsi-iscsi
      KOPIUR_SNAPSHOTCLASS: *sc
      KOPIUR_MOVER_UID: "0"
      KOPIUR_MOVER_GID: "0"
      KOPIUR_MOVER_NON_ROOT: "false"
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-ops
    namespace: flux-system
  targetNamespace: *namespace
