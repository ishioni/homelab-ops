---
# yaml-language-server: $schema=https://crd.movishell.pl/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app frigate
  namespace: &namespace selfhosted
spec:
  components:
    - ../../../../components/gpu
    - ../../../../components/kopiur
  dependsOn:
    - name: dcsi-iscsi
      namespace: storage
    - name: external-secrets
      namespace: security
    - name: intel-gpu-resource-driver
      namespace: kube-system
    - name: kopiur
      namespace: storage
  interval: 30m
  path: ./kubernetes/apps/selfhosted/frigate/app
  postBuild:
    substitute:
      APP: *app
      HOSTNAME: frigate.${PRIVATE_DOMAIN}
      PVC_CLAIM: frigate-config
      PVC_CAPACITY: 5Gi
      PVC_STORAGECLASS: &sc dcsi-iscsi
      KOPIUR_SNAPSHOTCLASS: *sc
  patches:
    - patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: frigate
          annotations:
            kopiur.home-operations.com/allow-identity-change: "true"
        spec:
          mover:
            inheritSecurityContextFrom:
              pvcConsumer:
                container: app
            securityContext:
              runAsNonRoot: false
      target:
        group: kopiur.home-operations.com
        version: v1alpha1
        kind: SnapshotPolicy
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-ops
    namespace: flux-system
  targetNamespace: *namespace
