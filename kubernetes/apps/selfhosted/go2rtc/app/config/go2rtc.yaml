  ice_servers:
    - urls:
        - stun:stun.cloudflare.com:3478
streams:
  bedcam:
    - $${RTSP_PATHS_BEDCAM_SOURCE}
    - ffmpeg:bedcam#audio=opus
  kidscam:
    - $${RTSP_PATHS_KIDSCAM_SOURCE}
    - ffmpeg:kidscam#audio=opus
