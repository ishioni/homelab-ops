---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name meshmonitor-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
        DISABLE_ANONYMOUS: "true"
        DISABLE_LOCAL_AUTH: "true"
        DATABASE_URL: |-
          postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-apps-rw.database.svc.cluster.local:5432/meshmonitor?sslmode=verify-full&sslrootcert=/etc/internal-ca/ca.crt
        OIDC_ISSUER: https://${AUTH_HOSTNAME}/application/o/meshmonitor/
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        OIDC_REDIRECT_URI: https://${HOSTNAME}/api/auth/oidc/callback
        OIDC_ADMIN_GROUPS: infrastructure

        # Postgres Init
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /etc/internal-ca/ca.crt
        INIT_POSTGRES_DBNAME: meshmonitor
        INIT_POSTGRES_HOST: postgres-apps-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: meshmonitor
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name meshmonitor-internal-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: internal-ca
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: internal-ca-key-pair
        property: tls.crt
