---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # Paperless
        PAPERLESS_DBENGINE: postgresql
        PAPERLESS_DBPORT: "5432"
        PAPERLESS_DBNAME: &dbname paperless
        PAPERLESS_DBHOST: &dbhost postgres-apps-rw.database.svc.cluster.local
        PAPERLESS_DBUSER: &dbuser "{{ .PAPERLESS_DBUSER }}"
        PAPERLESS_DBPASS: &dbpass "{{ .PAPERLESS_DBPASS }}"
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_REDIS: 'rediss://:{{ .DRAGONFLY_REDIS_PASSWORD | urlquery | replace "+" "%20" }}@dragonfly.database.svc.cluster.local:6379/4?ssl_ca_certs=%2Fetc%2Finternal-ca%2Fca.crt&ssl_cert_reqs=required'
        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # OIDC
        PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
        PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
        PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
                "APPS": [
                    {
                        "provider_id": "authentik",
                        "name": "Authentik",
                        "client_id": "{{ .OIDC_CLIENT_ID }}",
                        "secret": "{{ .OIDC_CLIENT_SECRET }}",
                        "settings": {
                            "server_url": "https://auth.movishell.pl/application/o/paperless/.well-known/openid-configuration"
                        }
                    }
                ]
            }
          }
  dataFrom:
    - extract:
        key: paperless
    - extract:
        key: cloudnative-pg
    - extract:
        key: dragonfly
      rewrite:
        - regexp: { source: "(.*)", target: "DRAGONFLY_$1" }
---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-internal-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: internal-ca
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: internal-ca-key-pair
        property: tls.crt
