---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name searxng-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        SEARXNG_SECRET: "{{ .SEARXNG_SECRET }}"
        SEARXNG_VALKEY_URL: 'redis://:{{ .DRAGONFLY_REDIS_PASSWORD | urlquery | replace "+" "%20" }}@dragonfly.database.svc.cluster.local:6379/2'
  dataFrom:
    - extract:
        key: searxng
    - extract:
        key: dragonfly
      rewrite:
        - regexp: { source: "(.*)", target: "DRAGONFLY_$1" }
