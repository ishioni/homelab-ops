---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 30m
  values:
    features:
      credentialProjection:
        enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: Operators
          matchLabels:
            grafana.internal/instance: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    ui:
      enabled: true
      auth:
        userHeader: X-authentik-username
        groupsHeader: X-authentik-groups
        groupsSeparator: "|"
        emailHeader: X-authentik-email
        allowedGroups: [infrastructure]
        # The app port is reachable only from the internal Envoy proxy pods.
        acknowledgeNoProxySecret: true
      rbac:
        browseRole: false
        bindings:
          - role: user
            groups: [infrastructure]
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
