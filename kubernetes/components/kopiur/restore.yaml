---
# yaml-language-server: $schema=https://crd.movishell.pl/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  credentialProjection:
    enabled: true
  mover:
    podSecurityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=${APP_UID:=1000}}
      runAsGroup: ${KOPIUR_MOVER_GID:=${APP_GID:=1000}}
      fsGroup: ${KOPIUR_MOVER_GID:=${APP_GID:=1000}}
    securityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=${APP_UID:=1000}}
      runAsGroup: ${KOPIUR_MOVER_GID:=${APP_GID:=1000}}
      runAsNonRoot: ${KOPIUR_MOVER_NON_ROOT:=true}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
